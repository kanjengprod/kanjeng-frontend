<style>

            margin: 1.5rem 0 0.5rem 1.25rem;
        }

        .menu-item { 
            display: flex;

    </style>


<script>
/**
 * SCRIPT KHUSUS HALAMAN DAYA TAHAN
 * Dibungkus otomatis oleh Dashboard Utama agar tidak bentrok
 */

function initDayaTahan() {
    console.log("🚀 Halaman Daya Tahan Dimuat");
    loadDataDayaTahan();
}

function loadDataDayaTahan() {
    // Tampilkan loading di tabel
    document.getElementById('tabel_daya_tahan').innerHTML = '<tr><td colspan="3" class="p-10 text-center">Sedang memuat...</td></tr>';

    /**
     * PENTING:
     * Karena sekarang pakai Worker, kamu harus menembak API.
     * Misal kamu punya fungsi di GAS namanya 'getDayaTahanData'
     * Kamu harus panggil via Worker API kamu (misal /api/login tapi kirim action: 'getDayaTahanData')
     */
     
    // CONTOH TEMBAK DATA KE GAS (Lewat Worker)
    fetch('/api/login', { // Menggunakan endpoint login worker sebagai proxy ke GAS
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            action: "getDayaTahanData", // Nama fungsi di GAS kamu
            ref: typeof ADMIN_REF !== 'undefined' ? ADMIN_REF : ''
        })
    })
    .then(res => res.json())
    .then(data => {
        // Contoh Update UI (Sesuaikan dengan format data GAS kamu)
        if(data.success) {
            document.getElementById('stat_likuiditas').innerText = data.totalLikuiditas;
            renderTabel(data.listData);
        }
    })
    .catch(err => {
        console.error("Gagal load data:", err);
        document.getElementById('tabel_daya_tahan').innerHTML = '<tr><td colspan="3" class="p-10 text-center text-red-500">Gagal mengambil data dari GAS</td></tr>';
    });
}

function renderTabel(list) {
    let html = '';
    // Logika render tabel kamu di sini...
    document.getElementById('tabel_daya_tahan').innerHTML = html;
}

// PANGGIL INIT SAAT HALAMAN SELESAI DI-INJECT
// Kita beri sedikit delay agar DOM siap
setTimeout(initDayaTahan, 100);
</script>
